---
outline_ss_server_version: 1.4.0
outline_ss_server_download_url: "https://github.com/Jigsaw-Code/outline-ss-server/releases/download/\
  v{{ outline_ss_server_version }}/outline-ss-server_{{ outline_ss_server_version }}_linux_x86_64.tar.gz"
outline_ss_server_install_dir: /opt/outline-ss-server
outline_ss_server_keys:
  - id: user-0
    port: 31337
    cipher: chacha20-ietf-poly1305
    secret: Change_Me!
outline_ss_server_metrics_address: ""  # 127.0.0.1:9091
outline_ss_server_host: ""  # hostname or IP of SS server
